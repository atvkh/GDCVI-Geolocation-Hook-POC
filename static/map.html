<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <title>坐标拾取</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a1630; }
        #container { width: 100%; height: 100%; }
        .center-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -100%);
            pointer-events: none; z-index: 1000;
            font-size: 36px; color: #ff4757;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        .coord-display {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #00E676;
            padding: 8px 16px; border-radius: 20px;
            font-size: 12px; font-family: monospace;
            z-index: 1000; pointer-events: none;
        }
        .confirm-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #328cdc 0%, #1a6dd4 100%);
            color: #fff; border: none; border-radius: 24px;
            padding: 12px 40px; font-size: 15px; font-weight: 600;
            z-index: 1000; cursor: pointer;
            box-shadow: 0 4px 16px rgba(50, 140, 220, 0.4);
            transition: transform 0.2s;
        }
        .confirm-btn:active { transform: translateX(-50%) scale(0.95); }
        .hint-bar {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: rgba(255,255,255,0.7);
            padding: 6px 14px; border-radius: 16px;
            font-size: 12px; z-index: 1000; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="center-marker">📍</div>
    <div class="hint-bar">拖动地图将 📍 对准目标位置</div>
    <div class="coord-display" id="coordDisplay">23.73, 113.08</div>
    <button class="confirm-btn" id="confirmBtn">确认选点</button>

    <script>
        function gcj02ToWgs84(lat, lng) {
            var a = 6378245.0;
            var ee = 0.00669342162296594323;
            var dLat = transformLat(lng - 105.0, lat - 35.0);
            var dLng = transformLng(lng - 105.0, lat - 35.0);
            var radLat = lat / 180.0 * Math.PI;
            var magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            var sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
            return { lat: lat - dLat, lng: lng - dLng };
        }

        function wgs84ToGcj02(lat, lng) {
            var a = 6378245.0;
            var ee = 0.00669342162296594323;
            var dLat = transformLat(lng - 105.0, lat - 35.0);
            var dLng = transformLng(lng - 105.0, lat - 35.0);
            var radLat = lat / 180.0 * Math.PI;
            var magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            var sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
            return { lat: lat + dLat, lng: lng + dLng };
        }
        function transformLat(x, y) {
            var pi = 3.14159265358979324;
            var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(y * pi) + 40.0 * Math.sin(y / 3.0 * pi)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(y / 12.0 * pi) + 320 * Math.sin(y * pi / 30.0)) * 2.0 / 3.0;
            return ret;
        }
        function transformLng(x, y) {
            var pi = 3.14159265358979324;
            var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(x * pi) + 40.0 * Math.sin(x / 3.0 * pi)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(x / 12.0 * pi) + 300.0 * Math.sin(x / 30.0 * pi)) * 2.0 / 3.0;
            return ret;
        }

        var map;
        window.selectedLocation = null;
        window.__userInteracted = false;
        window.__confirmed = false;

        var INIT_GCJ_LAT = 23.73513;
        var INIT_GCJ_LNG = 113.088972;

        function init() {
            try {
                if (typeof L === 'undefined') {
                    document.getElementById('coordDisplay').textContent = '地图加载失败，请检查网络';
                    return;
                }
                var wgsInit = gcj02ToWgs84(INIT_GCJ_LAT, INIT_GCJ_LNG);

                map = L.map('container', {
                    center: [wgsInit.lat, wgsInit.lng],
                    zoom: 16
                });

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                map.on('moveend', function() {
                    var center = map.getCenter();
                    var gcj = wgs84ToGcj02(center.lat, center.lng);
                    window.selectedLocation = { lat: gcj.lat, lng: gcj.lng };
                    document.getElementById('coordDisplay').textContent =
                        gcj.lat.toFixed(6) + ', ' + gcj.lng.toFixed(6);
                });

                map.on('dragstart', function() {
                    window.__userInteracted = true;
                });

                map.on('zoomstart', function() {
                    window.__userInteracted = true;
                });

                window.selectedLocation = { lat: INIT_GCJ_LAT, lng: INIT_GCJ_LNG };
            } catch (e) {
                document.getElementById('coordDisplay').textContent = '地图初始化失败: ' + e.message;
            }
        }

        function sendResult(loc) {
            var payload = JSON.stringify({ lat: loc.lat, lng: loc.lng, name: '地图选点', ts: Date.now() });

            // 通道1: plus.storage（与 uni.setStorageSync 同一后端，最可靠）
            try {
                if (window.plus && plus.storage) {
                    plus.storage.setItem('__map_picker_result', payload);
                } else {
                    localStorage.setItem('__map_picker_result', payload);
                }
            } catch(e) {
                try { localStorage.setItem('__map_picker_result', payload); } catch(e2) {}
            }

            // 通道2: 直接 evalJS 父页面
            try {
                if (window.plus) {
                    var wv = plus.webview.currentWebview();
                    var parent = wv.parent() || wv.opener();
                    if (parent) {
                        parent.evalJS("(function(){try{if(window.__onMapPickerResult) window.__onMapPickerResult({lat:" + loc.lat + ",lng:" + loc.lng + ",name:'地图选点'})}catch(e){}})()");
                    }
                }
            } catch(e) {}

            // 通道3: 遍历所有 webview 尝试回传
            try {
                if (window.plus) {
                    var all = plus.webview.all();
                    for (var i = 0; i < all.length; i++) {
                        try {
                            var w = all[i];
                            if (w && w.id !== plus.webview.currentWebview().id) {
                                w.evalJS("(function(){try{if(window.__onMapPickerResult) window.__onMapPickerResult({lat:" + loc.lat + ",lng:" + loc.lng + ",name:'地图选点'})}catch(e){}})()");
                            }
                        } catch(e2) {}
                    }
                }
            } catch(e3) {}
        }

        function confirmSelection() {
            try {
                if (!map) {
                    window.selectedLocation = window.selectedLocation || { lat: INIT_GCJ_LAT, lng: INIT_GCJ_LNG };
                } else {
                    var center = map.getCenter();
                    var gcj = wgs84ToGcj02(center.lat, center.lng);
                    window.selectedLocation = { lat: gcj.lat, lng: gcj.lng };
                }
                window.__confirmed = true;
                sendResult(window.selectedLocation);
            } catch (e) {
                window.selectedLocation = window.selectedLocation || { lat: INIT_GCJ_LAT, lng: INIT_GCJ_LNG };
                window.__confirmed = true;
                sendResult(window.selectedLocation);
            }
        }

        // 等 plusready 后再绑定按钮，确保 plus 可用
        function bindButton() {
            var btn = document.getElementById('confirmBtn');
            if (btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    confirmSelection();
                });
            }
        }

        if (window.plus) {
            bindButton();
        } else {
            document.addEventListener('plusready', bindButton);
        }
        // 兜底：即使没 plusready 也绑定
        setTimeout(bindButton, 500);

        window.onload = init;
    </script>
</body>
</html>
